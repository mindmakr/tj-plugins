name: Registry check

on:
  pull_request:
    paths:
      - "index/**"
      - "packages/**"
      - "catalog.json"
      - ".github/workflows/review.yml"
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Build tj CLI from mindmakr/tinyjump
        run: |
          git clone --depth 1 https://github.com/mindmakr/tinyjump.git /tmp/tinyjump
          cargo build --manifest-path /tmp/tinyjump/Cargo.toml --release -p tj-cli

      - name: Validate every manifest in index/ and catalog.json
        env:
          EVENT_NAME: ${{ github.event_name }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess, sys, tempfile, urllib.request

          tj = "/tmp/tinyjump/target/release/tj"
          index_dir = pathlib.Path("index")
          manifests = sorted(index_dir.glob("*.json"))
          if not manifests:
              print("No manifests found in index/")
              sys.exit(0)

          MAX_BYTES = 1_048_576
          ENTRY_RE = re.compile(r"^[A-Za-z0-9._/-]+$")
          HEX40_RE = re.compile(r"^[0-9a-f]{40}$")

          def safe_entry(entry: str) -> bool:
              if not entry or entry.startswith("/") or not ENTRY_RE.match(entry):
                  return False
              parts = pathlib.PurePosixPath(entry).parts
              return all(p not in ("", ".", "..") for p in parts)

          # On pull_request, find manifests added or modified in this PR for trust-mark gating.
          changed_manifests = set()
          event_name = os.environ.get("EVENT_NAME", "")
          author_assoc = os.environ.get("AUTHOR_ASSOCIATION", "")
          base_ref = os.environ.get("BASE_REF", "")
          if event_name == "pull_request" and base_ref:
              subprocess.run(["git", "fetch", "origin", base_ref], check=False)
              diff = subprocess.check_output(
                  ["git", "diff", "--name-only", f"origin/{base_ref}...HEAD", "--", "index/"],
                  text=True,
              )
              changed_manifests = {line.strip() for line in diff.splitlines() if line.strip()}

          failed = False
          seen_names = set()
          for mf in manifests:
              data = json.loads(mf.read_text("utf-8"))
              stem = mf.stem
              seen_names.add(stem)
              if data.get("name") != stem:
                  print(f"FAIL {mf}: manifest name {data.get('name')!r} != filename stem {stem!r}")
                  failed = True
                  continue

              # REG-2: community PRs may only submit trust="community".
              rel_mf = mf.as_posix()
              trust = str(data.get("trust", "community")).strip().lower()
              if rel_mf in changed_manifests and trust != "community" and author_assoc not in ("OWNER", "MEMBER"):
                  print(f"FAIL {mf}: community PRs may only set trust='community' (got {trust!r}; maintainers promote to verified/official)")
                  failed = True
                  continue

              entry = str(data.get("entry", "plugin.tj"))
              commit = str(data.get("commit", ""))
              if not safe_entry(entry):
                  print(f"FAIL {mf}: unsafe entry path {entry!r}")
                  failed = True
                  continue
              if not HEX40_RE.match(commit):
                  print(f"FAIL {mf}: commit must be a 40-char lowercase git SHA (got {commit!r})")
                  failed = True
                  continue

              # Resolve pinned source bytes:
              # REG-1: for in-repo mindmakr/tj-plugins commits, read the exact git object via `git cat-file`
              # so fork/merge-commit PRs verify the exact pinned commit SHA without relying on HEAD.
              src = str(data.get("source", "")).rstrip("/")
              if src.endswith(".git"):
                  src = src[:-4]

              raw_bytes = None
              if src == "https://github.com/mindmakr/tj-plugins" and not data.get("url"):
                  git_spec = f"{commit}:{entry}"
                  probe = subprocess.run(["git", "cat-file", "-e", git_spec], capture_output=True)
                  if probe.returncode == 0:
                      raw_bytes = subprocess.check_output(["git", "cat-file", "-p", git_spec])
                      if len(raw_bytes) > MAX_BYTES:
                          print(f"FAIL {mf}: {git_spec} exceeds {MAX_BYTES} byte limit")
                          failed = True
                          continue

              if raw_bytes is None:
                  url = data.get("url")
                  if not url:
                      prefix = "https://github.com/"
                      if src.startswith(prefix):
                          owner_repo = src[len(prefix):]
                          url = f"https://raw.githubusercontent.com/{owner_repo}/{commit}/{entry}"
                  if not url or not str(url).startswith("https://"):
                      print(f"FAIL {mf}: cannot derive HTTPS source URL")
                      failed = True
                      continue
                  try:
                      with urllib.request.urlopen(str(url), timeout=20) as resp:
                          raw_bytes = resp.read(MAX_BYTES + 1)
                      if len(raw_bytes) > MAX_BYTES:
                          print(f"FAIL {mf}: {url} exceeds {MAX_BYTES} byte limit")
                          failed = True
                          continue
                  except Exception as e:
                      print(f"FAIL {mf}: could not fetch {url}: {e}")
                      failed = True
                      continue

              with tempfile.NamedTemporaryFile(delete=False) as tmp:
                  tmp_path = tmp.name
                  tmp.write(raw_bytes)
              res = subprocess.run([tj, "registry", "check", str(mf), "--index", str(index_dir), "--source", tmp_path])
              os.unlink(tmp_path)
              if res.returncode != 0:
                  failed = True

          # Verify root catalog.json stays in sync with index/*.json if present.
          cat_path = pathlib.Path("catalog.json")
          if cat_path.is_file():
              cat = json.loads(cat_path.read_text("utf-8"))
              cat_names = {p["name"] for p in cat.get("packages", [])}
              if cat_names != seen_names:
                  print(f"FAIL catalog.json out of sync with index/: catalog={sorted(cat_names)} index={sorted(seen_names)}")
                  failed = True

          if failed:
              sys.exit(1)
          PY
